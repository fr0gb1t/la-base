version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: la-base-db
    environment:
      POSTGRES_USER: labase
      POSTGRES_PASSWORD: labase_dev
      POSTGRES_DB: labase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labase"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: la-base-server
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://labase:labase_dev@postgres:5432/labase
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/server/src:/app/src
    command: npm run dev

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: la-base-client
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./packages/client/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
